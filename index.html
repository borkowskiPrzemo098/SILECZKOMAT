<!--
THESIS: a training app drawn as a living anatomical atlas: every exercise is a plate with an animated figure and the working muscles lit on a body chart, and the plan visibly bends around the body's pain and the gym's equipment; refuses rings, gradients and stock workout photos.
OWN-WORLD: atlas plate on a dark specimen ground (light twin: atlas paper), bone-white ink, muscle red for working muscles, pale tendon tint for secondary ones, sage green only for done states; Unbounded wide heavy for numbers and titles, Onest for UI; thin plate rules, 10px corners, figures drawn in one stroke grammar.
STORY: user sets profile, goal, equipment and pain on the body chart; sees today's plan with reasons for every swap; trains with set counter and rest timer; tracks 1RM and goals; on PR day gets mobility, a warm-up ramp and three attempts.
FIRST VIEWPORT: (app) date + greeting, focus chips, today's plate list with animated figures, primary "Zacznij trening", PR day entry; bottom tab bar.
FORM: anatomical atlas (user-chosen over the dealt candidate 5, competition board); seed key 74af2af1.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
